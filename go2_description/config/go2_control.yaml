joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 500

# The order must match JOINT_NAMES in go2_locomotion_logic.py and the policy
# node.  JointState is mapped by name, but the effort array is positional.
joint_group_effort_controller:
  type: effort_controllers/JointGroupEffortController
  joints:
    - FL_hip_joint
    - FL_thigh_joint
    - FL_calf_joint
    - FR_hip_joint
    - FR_thigh_joint
    - FR_calf_joint
    - RL_hip_joint
    - RL_thigh_joint
    - RL_calf_joint
    - RR_hip_joint
    - RR_thigh_joint
    - RR_calf_joint
